# cargo-audit configuration — vulnerability scanning of Cargo.lock (§14, §17).
# Parallel to deny.toml (cargo-deny). cargo-audit scans the *entire* lockfile
# regardless of which Cargo features are enabled, so advisories on crates that
# are resolved-but-never-compiled still surface and must be acknowledged here.
# Keep this list in sync with deny.toml's `[advisories] ignore` when silencing
# an advisory in both tools.

[advisories]
ignore = [
    # rsa 0.9.10 — RUSTSEC-2023-0071 (Marvin Attack: timing sidechannel on RSA
    # private-key operations, severity 5.9 medium).
    #
    # Transitive dep of sqlx-mysql: sqlx 0.8 lists its driver crates as optional
    # dependencies, which Cargo resolves into Cargo.lock even when the gating
    # feature is NOT enabled. We do not enable sqlx's `mysql` feature — the store
    # crate uses postgres + sqlite only (crates/store/Cargo.toml, §12) — so `rsa`
    # is never compiled into any Nexus Character Sheet binary:
    #   $ cargo tree -i rsa --target all
    #   warning: nothing to print.
    # The advisory has NO fixed upgrade available upstream (as of the advisory
    # DB). No risk surface (we perform no RSA operations; the crate is uncompiled),
    # no fix to bump to — acknowledged here rather than left failing CI.
    "RUSTSEC-2023-0071",
    # libsqlite3-sys 0.30.1 — RUSTSEC-2026-0459 (CVE-2026-119375, 6.8 medium).
    # Bundled SQLite before 3.54.0 can return uninitialized page-cache memory
    # when a database is opened next to a sibling `-wal` file with a different
    # page size.
    #
    # Unlike `rsa` above, this one IS compiled in — `sqlx/sqlite` turns on
    # `sqlx-sqlite/bundled` -> `libsqlite3-sys/bundled`:
    #   $ cargo tree -e features -i libsqlite3-sys --all-features
    # It is silenced because no upgrade path exists, not because it is
    # unreachable. The fix landed in libsqlite3-sys >=0.39.0, but sqlx 0.8.6
    # requires `^0.30.1` and even sqlx 0.9.0 (latest, crates.io index checked
    # 2026-11-09) requires `>=0.30.1, <0.38.0` — so no sqlx release can resolve
    # a patched libsqlite3-sys today.
    #
    # Exposure: local vector only, requiring the process to open a database plus
    # a `-wal` a less-trusted party could have written. SQLite is the offline
    # CLI store (§12), which creates its own file; the hosted API uses Postgres.
    #
    # REVIEW: remove once sqlx raises its libsqlite3-sys bound to >=0.39.
    # Mirrored in deny.toml — keep both in sync.
    "RUSTSEC-2026-0459",
    # bincode (RUSTSEC-2025-0141), paste (RUSTSEC-2024-0436) and
    # astral-tokio-tar (RUSTSEC-2026-0440) are deliberately
    # NOT silenced here: cargo-audit treats `unmaintained` as a non-fatal warning
    # by default, so they don't fail CI and remain useful signal. Both are
    # unmaintained transitive deps with no safe upgrade (bincode and paste via
    # deno_core; astral-tokio-tar via the dev-only testcontainers tree) and are
    # already acknowledged (silenced) in deny.toml, where cargo-deny treats them
    # as fatal. They surface here as the "allowed warnings" line in the
    # cargo-audit output, which does not fail the run.
]
