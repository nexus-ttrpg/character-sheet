# cargo-deny configuration — supply chain + license auditing (§14, §17).
# Tightened over time; deliberately permissive at scaffold stage.

[advisories]
# Warn on advisories, fail CI only on high/critical for now.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # bincode 1.x is unmaintained; transitive dep of deno_core. No safe upgrade.
    "RUSTSEC-2025-0141",
    # paste is no longer maintained; transitive dep of deno_core (v8 macro).
    "RUSTSEC-2024-0436",
]

[licenses]
# Allow common permissive licenses; review on first real dependency addition.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
# Flag duplicate versions; don't hard-fail yet.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Only crates.io by default; deny unknown registries and git sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
