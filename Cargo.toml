[workspace]
resolver = "2"
members = [
    "crates/schema-core",
    "crates/schema-pf2e",
    "crates/schema-sf2e",
    "crates/sync-engine",
    "crates/store",
    "crates/adapter-host",
    "crates/api",
    "cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nexus-sheet/nexus-sheet"
authors = ["Nexus Sheet contributors"]

[workspace.dependencies]
# Internal crates
schema-core = { path = "crates/schema-core" }
schema-pf2e = { path = "crates/schema-pf2e" }
schema-sf2e = { path = "crates/schema-sf2e" }
sync-engine = { path = "crates/sync-engine" }
store = { path = "crates/store" }
adapter-host = { path = "crates/adapter-host" }
api = { path = "crates/api" }

# Shared external deps (§14)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["chrono"] }
blake3 = "1"
hex = "0.4"
semver = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "2"
garde = "0.20"
proptest = "1"

# Store (§12, §14)
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "json", "chrono"] }
async-trait = "0.1"
secrecy = "0.10"
aes-gcm = "0.10"
ulid = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
