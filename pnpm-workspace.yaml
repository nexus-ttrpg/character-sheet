packages:
  - "packages/*"
  - "adapters/*"

# pnpm 11+ reads settings here, not from a `pnpm` field in package.json.
# esbuild (a vitest transitive dep) needs its postinstall to link its platform
# binary; `allowBuilds` is pnpm 11's non-interactive approval (§17 supply chain:
# only this one build script is permitted to run).
allowBuilds:
  esbuild: true
