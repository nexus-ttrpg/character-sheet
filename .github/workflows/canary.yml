# Canary job (§16, §21) — detects adapter regressions and upstream format changes.
#
# Three layers:
# 1. contract-tests — adapter SDK contract harness (catches mapping regressions)
# 2. e2e-gate — full Foundry→canonical→Foundry cycle through the V8 sandbox
#    (push→import→merge→conflict→resolve→export). Exercises the real adapter
#    bundle, not just fixtures. Catches regressions in adapter.export/import,
#    the adapter-worker bridge, and the merge engine against real PF2e data.
# 3. live-canary — hits an external staging API with a live Foundry relay.
#    Catches upstream format changes. Only runs when CANARY_API_URL +
#    CANARY_API_KEY secrets are present. See scripts/canary.sh for setup.
#
# This workflow runs weekly + on demand.

name: canary

on:
  schedule:
    # Every Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        name: Adapter contract tests (canary)

  e2e-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexus-ttrpg/foundry-adapter bundle
        name: Build Foundry adapter bundle
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p api --test e2e_gate -- --nocapture
        name: E2E gate — Foundry→canonical→Foundry divergent merge

  live-canary:
    runs-on: ubuntu-latest
    # Only run when live credentials are configured.
    if: ${{ vars.ENABLE_LIVE_CANARY == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Live platform canary
        env:
          CANARY_API_URL: ${{ secrets.CANARY_API_URL }}
          CANARY_API_KEY: ${{ secrets.CANARY_API_KEY }}
          CANARY_RELAY_URL: ${{ secrets.CANARY_RELAY_URL }}
        run: ./scripts/canary.sh

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace -j 1
        name: Rust test suite (canary)
