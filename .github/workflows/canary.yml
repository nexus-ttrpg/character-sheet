# Canary job (§16, §21) — detects upstream format changes.
#
# A real canary imports a known test character from each live third-party
# platform and alerts if the import fails or produces unexpected warnings.
# This scaffold runs the adapter contract tests on a schedule — they use
# fixtures, not live platforms, so they catch regressions in our mapping
# logic but not upstream format changes.
#
# To make this a real canary:
# 1. Deploy a test Foundry world + Roll20 campaign with known characters
# 2. Store relay API keys as GitHub secrets
# 3. Add a script that imports each test character via the API and diffs
#    the output against a pinned baseline
# 4. Alert on diff (Slack webhook / GitHub issue)
#
# This workflow runs weekly + on demand.

name: canary

on:
  schedule:
    # Every Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        name: Adapter contract tests (canary)

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace -j 1
        name: Rust test suite (canary)
