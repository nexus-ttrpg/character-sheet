name: rust

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + lint + boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to match rust-toolchain.toml (1.97.1) — avoids installing a
      # baseline stable that cargo then re-syncs away from on first invocation.
      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The CLI integration tests and the api e2e tests load the real Foundry
      # adapter bundle through the V8 sandbox. `adapters/foundry/dist/` is
      # gitignored (build artifact), so a fresh checkout has none and those
      # tests would fail — or, worse, silently skip. Build it before `cargo
      # test`, and set NEXUS_REQUIRE_ADAPTER_BUNDLE so a missing bundle is a
      # hard failure rather than a silent pass.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Foundry adapter bundle
        run: pnpm --filter @nexus-ttrpg/foundry-adapter bundle

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace
        env:
          NEXUS_REQUIRE_ADAPTER_BUNDLE: "1"

      - name: sync-engine boundary check (§15)
        run: |
          # sync-engine must depend on schema-core and nothing else — no store,
          # api, or adapter-host (the §15 invariant that makes the engine pure).
          for crate in store api adapter-host; do
            if cargo tree -p sync-engine --prefix none 2>/dev/null | grep -q "^$crate v"; then
              echo "::error::sync-engine depends on $crate — §15 boundary violation (engine must be pure, I/O-free)"
              exit 1
            fi
          done
          echo "OK: sync-engine dependency boundary intact"

  codegen-staleness:
    name: codegen staleness (§3.6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: regenerate
        run: cargo xtask codegen
      - name: fail if generated output drifted
        run: git diff --exit-code
